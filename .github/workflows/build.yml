name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test-linux:
    # Uri parsing differs between operating systems (e.g. "/page" is an absolute file URI on Unix), so run the tests on Linux too
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Test
        run: dotnet test --filter Category!=Integration
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # windows-latest no longer ships the .NET 6 runtime that the net6.0 test project runs on
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Build
        run: dotnet build
      - name: Test
        run: dotnet test --no-build --filter Category!=Integration
